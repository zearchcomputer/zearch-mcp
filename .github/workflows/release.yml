name: Release

# Push a version tag (v1.2.3) to publish @zearchcomputer/mcp to npm and list it in the
# official MCP Registry.
#
# npm auth, in order of preference:
#   1. Trusted publishing (OIDC): configure it on npmjs.com for this repo and this
#      workflow file, then delete the NPM_TOKEN secret. No secret involved.
#   2. The NPM_TOKEN repository secret: a granular token with read and write on
#      @zearchcomputer packages. Needed for the very first publish.
# The MCP Registry uses GitHub OIDC for the io.github.zearchcomputer namespace: no secret.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Tag, package.json and server.json agree
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json $VERSION"; exit 1; }
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            const pkg = s.packages.find((x) => x.registryType === "npm");
            const bad = [];
            if (s.version !== p.version) bad.push(`server.json version ${s.version}`);
            if (pkg.version !== p.version) bad.push(`server.json package version ${pkg.version}`);
            if (pkg.identifier !== p.name) bad.push(`server.json identifier ${pkg.identifier}`);
            if (s.name !== p.mcpName) bad.push(`server.json name ${s.name} vs mcpName ${p.mcpName}`);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }'

      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait until npm serves the new version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for i in $(seq 1 30); do
            npm view "@zearchcomputer/mcp@$VERSION" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm did not list @zearchcomputer/mcp@$VERSION within 5 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
