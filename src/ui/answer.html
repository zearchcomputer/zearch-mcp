<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zearch answer</title>
<style>
  /* Zearch "Ethereal Glass": monochrome, hairline borders, one cool accent.
     Host style variables (MCP Apps) override these when the host provides them. */
  :root {
    --z-canvas: #EEF0F6; --z-core: #FFFFFF; --z-ink: #0C0E14; --z-muted: #565C6B;
    --z-line: rgba(15, 23, 42, .09); --z-line-strong: rgba(15, 23, 42, .16);
    --z-accent: #3A4FE0; --z-accent-soft: rgba(58, 79, 224, .10);
    --z-ok: #146C43; --z-ok-bg: rgba(20, 108, 67, .10);
    --z-warn: #8A5300; --z-warn-bg: rgba(178, 106, 0, .12);
    --z-bad: #B42318; --z-bad-bg: rgba(180, 35, 24, .10);
    --z-radius: 14px;
    --z-sans: var(--font-sans, Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --z-mono: var(--font-mono, "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --z-canvas: #060608; --z-core: #0F1014; --z-ink: #F1F2F6; --z-muted: #9A9EAE;
    --z-line: rgba(255, 255, 255, .08); --z-line-strong: rgba(255, 255, 255, .14);
    --z-accent: #8FA2FF; --z-accent-soft: rgba(143, 162, 255, .14);
    --z-ok: #6FD3A0; --z-ok-bg: rgba(111, 211, 160, .12);
    --z-warn: #F2C26B; --z-warn-bg: rgba(242, 194, 107, .12);
    --z-bad: #FF8A80; --z-bad-bg: rgba(255, 138, 128, .12);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 14px/1.6 var(--z-sans); color: var(--color-text-primary, var(--z-ink));
    -webkit-font-smoothing: antialiased; padding: 2px;
  }
  .shell {
    background: var(--color-background-primary, var(--z-core));
    border: 1px solid var(--color-border-primary, var(--z-line));
    border-radius: var(--border-radius-lg, var(--z-radius)); padding: 16px 18px 14px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .mark { width: 22px; height: 22px; flex: none; color: var(--color-text-primary, var(--z-ink)); }
  .word { font-weight: 500; letter-spacing: -.045em; font-size: 17px; }
  .pill {
    margin-left: auto; font: 500 12px/1 var(--z-sans); padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--z-line-strong); color: var(--z-muted); white-space: nowrap;
  }
  .pill.ok { color: var(--z-ok); background: var(--z-ok-bg); border-color: transparent; }
  .pill.warn { color: var(--z-warn); background: var(--z-warn-bg); border-color: transparent; }
  .pill.bad { color: var(--z-bad); background: var(--z-bad-bg); border-color: transparent; }
  .question { color: var(--color-text-secondary, var(--z-muted)); margin: 0 0 12px; font-size: 13px; }
  .note { font-size: 13px; color: var(--z-warn); background: var(--z-warn-bg); padding: 8px 10px; border-radius: 10px; margin: 0 0 12px; }
  .answer > :first-child { margin-top: 0; }
  .answer p, .answer ul, .answer ol, .answer pre, .answer table, .answer blockquote { margin: 0 0 10px; }
  .answer h1, .answer h2, .answer h3, .answer h4 { font-weight: 500; letter-spacing: -.02em; margin: 14px 0 6px; line-height: 1.3; }
  .answer h1 { font-size: 18px; } .answer h2 { font-size: 16px; } .answer h3, .answer h4 { font-size: 15px; }
  .answer ul, .answer ol { padding-left: 20px; }
  .answer code { font: 12.5px var(--z-mono); background: var(--z-line); padding: 1px 5px; border-radius: 6px; }
  .answer pre { background: var(--z-line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; }
  .answer pre code { background: none; padding: 0; }
  .answer blockquote { border-left: 2px solid var(--z-line-strong); padding-left: 10px; color: var(--z-muted); }
  .answer table { border-collapse: collapse; width: 100%; font-size: 13px; display: block; overflow-x: auto; }
  .answer th, .answer td { border-bottom: 1px solid var(--z-line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .answer th { font-weight: 500; }
  .cite {
    font: 500 11px/1 var(--z-mono); color: var(--z-accent); background: var(--z-accent-soft);
    border: 0; border-radius: 6px; padding: 3px 5px; margin: 0 1px; cursor: pointer; vertical-align: 1px;
  }
  .cite:focus-visible, button:focus-visible { outline: 2px solid var(--z-accent); outline-offset: 2px; }
  h2.section { font: 500 12px/1 var(--z-sans); text-transform: uppercase; letter-spacing: .06em; color: var(--z-muted); margin: 16px 0 8px; }
  .sources { display: grid; gap: 8px; }
  .source {
    border: 1px solid var(--z-line); border-radius: 12px; padding: 10px 12px;
    transition: border-color .26s cubic-bezier(.32,.72,0,1), box-shadow .26s cubic-bezier(.32,.72,0,1);
  }
  .source.flash { border-color: var(--z-accent); box-shadow: 0 0 0 3px var(--z-accent-soft); }
  .source-head { display: flex; gap: 8px; align-items: baseline; }
  .n { font: 500 12px var(--z-mono); color: var(--z-accent); flex: none; }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .meta { font: 12px var(--z-mono); color: var(--z-muted); margin-top: 2px; overflow-wrap: anywhere; }
  .tag { font: 500 11px var(--z-sans); color: var(--z-ok); background: var(--z-ok-bg); padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .excerpt { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--z-line-strong); color: var(--z-ink); font-size: 13px; }
  .open {
    margin-left: auto; flex: none; font: 500 12px var(--z-sans); color: var(--z-ink); background: transparent;
    border: 1px solid var(--z-line-strong); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .followups { display: flex; flex-wrap: wrap; gap: 6px; }
  .follow {
    font: 13px var(--z-sans); color: var(--z-ink); background: transparent; border: 1px solid var(--z-line-strong);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; text-align: left;
  }
  .follow:hover, .open:hover { border-color: var(--z-accent); }
  .para { border: 1px solid var(--z-line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .para-head { display: flex; gap: 8px; align-items: center; font: 12px var(--z-mono); color: var(--z-muted); margin-bottom: 4px; }
  .bar { flex: 1; height: 4px; border-radius: 4px; background: var(--z-line); overflow: hidden; max-width: 140px; }
  .bar > i { display: block; height: 100%; background: currentColor; }
  footer { margin-top: 14px; font: 12px var(--z-mono); color: var(--z-muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .working { display: flex; align-items: center; gap: 10px; color: var(--z-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--z-accent); animation: pulse 1.2s cubic-bezier(.32,.72,0,1) infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .source { transition: none; } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="shell" id="app" aria-live="polite">
  <header>
    <svg class="mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
        <path d="M14 6C8 .5 1 2.5 1 9.5v8C1 25.5 8 28 14 22.5 20 17 20 11 14 6Z"/>
        <path d="M14 6C8 .5 1 2.5 1 9.5v8C1 25.5 8 28 14 22.5 20 17 20 11 14 6Z" transform="matrix(-1 0 0 1 28 0)"/>
      </g>
    </svg>
    <span class="word">zearch</span>
    <span class="pill" id="pill">Researching</span>
  </header>
  <p class="question" id="question"></p>
  <div id="body"><div class="working"><span class="dot"></span><span>Searching, selecting and checking sources…</span></div></div>
</div>
<script>
(() => {
  'use strict';
  const PROTOCOL = '2026-01-26';
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };

  // ---- host bridge (MCP Apps: JSON-RPC 2.0 over postMessage) -------------
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case 'ui/notifications/tool-input':
        onInput(msg.params && msg.params.arguments);
        break;
      case 'ui/notifications/tool-result':
        onResult(msg.params);
        break;
      case 'ui/notifications/tool-cancelled':
        renderMessage('Cancelled', 'This request was cancelled.', '');
        break;
      case 'ui/notifications/host-context-changed':
        applyContext(msg.params);
        break;
      default:
        // Answer host requests we don't act on (ping, ui/resource-teardown) so the host never waits.
        if (msg.id !== undefined && msg.method) post({ id: msg.id, result: {} });
    }
  });

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme === 'dark' || ctx.theme === 'light') document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v && k.startsWith('--')) document.documentElement.style.setProperty(k, v);
  }

  const openLink = (url) => request('ui/open-link', { url }).catch(() => {});
  const ask = (text) => request('ui/message', { role: 'user', content: [{ type: 'text', text }] }).catch(() => {});

  // ---- markdown (a safe subset; text only, never innerHTML) ---------------
  function inline(text, parent, onCite) {
    const re = /(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*|\[(\d+)\]|\[([^\]]+)\]\((https:\/\/[^)\s]+)\))/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.append(text.slice(last, m.index));
      const t = m[0];
      if (t.startsWith('**')) parent.append(el('strong', '', t.slice(2, -2)));
      else if (t.startsWith('`')) parent.append(el('code', '', t.slice(1, -1)));
      else if (m[2]) {
        const b = el('button', 'cite', m[2]);
        b.type = 'button';
        b.setAttribute('aria-label', `Source ${m[2]}`);
        b.addEventListener('click', () => onCite(Number(m[2])));
        parent.append(b);
      } else if (m[3]) {
        const a = el('a', '', m[3]);
        a.href = m[4];
        a.addEventListener('click', (e) => { e.preventDefault(); openLink(m[4]); });
        parent.append(a);
      } else parent.append(el('em', '', t.slice(1, -1)));
      last = m.index + t.length;
    }
    if (last < text.length) parent.append(text.slice(last));
  }

  function markdown(src, onCite) {
    const root = el('div', 'answer');
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    let i = 0;
    const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      const fence = line.match(/^```(\w*)/);
      if (fence) {
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        const pre = el('pre');
        pre.append(el('code', '', buf.join('\n')));
        root.append(pre);
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)/);
      if (h) { const n = el('h' + Math.min(4, h[1].length + 1)); inline(h[2], n, onCite); root.append(n); i++; continue; }
      if (isTable(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const table = el('table'), thead = el('thead'), tbody = el('tbody'), hr = el('tr');
        for (const c of cells(line)) { const th = el('th'); inline(c, th, onCite); hr.append(th); }
        thead.append(hr);
        i += 2;
        while (i < lines.length && isTable(lines[i])) {
          const tr = el('tr');
          for (const c of cells(lines[i++])) { const td = el('td'); inline(c, td, onCite); tr.append(td); }
          tbody.append(tr);
        }
        table.append(thead, tbody);
        root.append(table);
        continue;
      }
      const li = line.match(/^\s*([-*]|\d+[.)])\s+(.*)/);
      if (li) {
        const list = el(/\d/.test(li[1]) ? 'ol' : 'ul');
        while (i < lines.length) {
          const m = lines[i].match(/^\s*([-*]|\d+[.)])\s+(.*)/);
          if (!m) break;
          const item = el('li');
          inline(m[2], item, onCite);
          list.append(item);
          i++;
        }
        root.append(list);
        continue;
      }
      if (/^>\s?/.test(line)) {
        const q = el('blockquote'), buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
        inline(buf.join(' '), q, onCite);
        root.append(q);
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+[.)])\s|>)/.test(lines[i]) && !isTable(lines[i])) buf.push(lines[i++]);
      const p = el('p');
      inline(buf.join(' '), p, onCite);
      root.append(p);
    }
    return root;
  }

  // ---- rendering ---------------------------------------------------------
  const body = $('body');
  const pill = (text, tone) => { const p = $('pill'); p.textContent = text; p.className = 'pill' + (tone ? ' ' + tone : ''); };
  const pct = (p) => (typeof p === 'number' ? Math.round(p * 100) + '%' : 'n/a');

  function onInput(args) {
    if (args && typeof args.query === 'string') $('question').textContent = args.query;
    else if (args && typeof args.question === 'string') $('question').textContent = args.question;
    if (args && typeof args.text === 'string' && Array.isArray(args.sources)) pill('Checking', '');
  }

  function renderMessage(title, text, tone) {
    pill(title, tone);
    body.replaceChildren(el('p', 'note', text));
  }

  function onResult(result) {
    const data = result && result.structuredContent;
    if (result && result.isError && !data) {
      const msg = (result.content || []).map((c) => c.text).filter(Boolean).join('\n') || 'Something went wrong.';
      return renderMessage('Not completed', msg, 'bad');
    }
    if (!data) return renderMessage('No result', 'There is nothing to show for this call.', '');
    if (Array.isArray(data.paragraphs)) return renderVerification(data);
    if (data.id && data.status) return renderRun(data);
    renderMessage('Result', (result.content || []).map((c) => c.text).join('\n'), '');
  }

  function renderRun(run) {
    if (run.query) $('question').textContent = run.query;
    const sources = Array.isArray(run.sources) ? run.sources : [];
    if (run.status === 'pending' || run.status === 'streaming') {
      pill('Working', '');
      body.replaceChildren(el('div', 'working'));
      body.firstChild.append(el('span', 'dot'), el('span', '', 'Still working. Ask again in a moment to see the answer.'));
      return;
    }
    if (run.status === 'error' || run.status === 'interrupted') return renderMessage('Not completed', run.error || "This run didn't finish. Errors aren't charged.", 'bad');
    if (run.status === 'redacted') return renderMessage('Redacted', 'This answer was redacted because a source or note it used was deleted.', '');

    const frag = document.createDocumentFragment();
    const support = (run.verification && run.verification.paragraph_support) || [];
    if (run.answer_type === 'verified') {
      pill(`Checked · ${sources.length} source${sources.length === 1 ? '' : 's'}`, 'ok');
    } else if (run.answer_type === 'excerpt') {
      pill('Source passage', 'warn');
      frag.append(el('p', 'note', "Zearch couldn't verify an answer. Here's what the best source says."));
    } else pill('Answer', '');

    const cards = new Map();
    const focusSource = (n) => {
      const card = cards.get(n);
      if (!card) return;
      card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1200);
    };
    frag.append(markdown(run.answer, focusSource));

    if (sources.length) {
      frag.append(el('h2', 'section', 'Sources'));
      const list = el('div', 'sources');
      for (const s of sources) {
        const card = el('section', 'source');
        card.id = 'source-' + s.n;
        const head = el('div', 'source-head');
        head.append(el('span', 'n', '[' + s.n + ']'));
        const titleWrap = el('div');
        const title = el('div', 'title', s.title || s.domain || s.url || 'Untitled source');
        if (s.authority === 'official') title.append(el('span', 'tag', 'Official source'));
        titleWrap.append(title);
        const meta = [s.domain, s.published_date ? 'published ' + s.published_date : null, s.capture_id ? 'capture ' + s.capture_id : null].filter(Boolean).join(' · ');
        if (meta) titleWrap.append(el('div', 'meta', meta));
        head.append(titleWrap);
        if (s.url && /^https?:\/\//.test(s.url)) {
          const open = el('button', 'open', 'Open');
          open.type = 'button';
          open.setAttribute('aria-label', 'Open source ' + s.n);
          open.addEventListener('click', () => openLink(s.url));
          head.append(open);
        }
        card.append(head);
        if (s.excerpt) card.append(el('blockquote', 'excerpt', s.excerpt));
        cards.set(s.n, card);
        list.append(card);
      }
      frag.append(list);
    }

    if (Array.isArray(run.followups) && run.followups.length) {
      frag.append(el('h2', 'section', 'Follow up'));
      const row = el('div', 'followups');
      for (const f of run.followups.slice(0, 3)) {
        const b = el('button', 'follow', f);
        b.type = 'button';
        b.addEventListener('click', () => ask(f));
        row.append(b);
      }
      frag.append(row);
    }

    const foot = el('footer');
    if (support.length) foot.append(el('span', '', `lowest paragraph support ${pct(Math.min(...support))}`));
    if (run.verification && run.verification.model) foot.append(el('span', '', 'Jev ' + run.verification.model));
    if (typeof run.timing_ms === 'number') foot.append(el('span', '', (run.timing_ms / 1000).toFixed(1) + ' s'));
    foot.append(el('span', '', 'run ' + run.id.slice(0, 8)));
    frag.append(foot);
    body.replaceChildren(frag);
  }

  function renderVerification(v) {
    const failed = v.paragraphs.filter((p) => !p.passed).length;
    pill(failed ? `${failed} of ${v.paragraphs.length} unsupported` : `All ${v.paragraphs.length} supported`, failed ? 'bad' : 'ok');
    const frag = document.createDocumentFragment();
    for (const p of v.paragraphs) {
      const box = el('section', 'para');
      const head = el('div', 'para-head');
      const status = el('span', 'pill ' + (p.passed ? 'ok' : 'bad'), p.passed ? 'Supported' : 'Not supported');
      status.style.marginLeft = '0';
      head.append(status, el('span', '', '¶' + (p.index + 1) + ' · support ' + pct(p.support) + (p.attribution != null ? ' · attribution ' + pct(p.attribution) : '')));
      const bar = el('span', 'bar');
      bar.style.color = p.passed ? 'var(--z-ok)' : 'var(--z-bad)';
      const fill = el('i');
      fill.style.width = Math.max(2, Math.round((p.support || 0) * 100)) + '%';
      bar.append(fill);
      head.append(bar);
      box.append(head, markdown(p.text, () => {}));
      frag.append(box);
    }
    const foot = el('footer');
    if (typeof v.threshold === 'number') foot.append(el('span', '', 'threshold ' + pct(v.threshold)));
    if (v.model) foot.append(el('span', '', 'Jev ' + v.model));
    frag.append(foot);
    body.replaceChildren(frag);
  }

  // ---- size and start ----------------------------------------------------
  let lastHeight = 0;
  new ResizeObserver(() => {
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (height !== lastHeight) { lastHeight = height; notify('ui/notifications/size-changed', { height }); }
  }).observe(document.documentElement);

  request('ui/initialize', {
    appInfo: { name: 'zearch-answer', version: '0.1.0' },
    appCapabilities: { availableDisplayModes: ['inline'] },
    protocolVersion: PROTOCOL,
  })
    .then((result) => {
      applyContext(result && result.hostContext);
      notify('ui/notifications/initialized', {});
    })
    .catch(() => notify('ui/notifications/initialized', {}));

  if (matchMedia('(prefers-color-scheme: dark)').matches && !document.documentElement.dataset.theme) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
</body>
</html>
